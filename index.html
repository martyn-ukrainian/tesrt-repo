<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Repo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #222;
    }
    h1 { font-size: 2rem; }
    .cat {
      display: block;
      margin: 2rem auto;
      max-width: 100%;
      border-radius: 12px;
      animation: dance 0.8s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes dance {
      0%   { transform: rotate(-8deg) translateY(0)     scale(1); }
      25%  { transform: rotate(0deg)  translateY(-18px) scale(1.04, 0.96); }
      50%  { transform: rotate(8deg)  translateY(0)     scale(1); }
      75%  { transform: rotate(0deg)  translateY(-18px) scale(0.96, 1.04); }
      100% { transform: rotate(-8deg) translateY(0)     scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .cat { animation: none; } }
  </style>
</head>
<body>
  <h1>Привіт!</h1>
  <p>Це проста тестова HTML-сторінка в репозиторії <strong>tesrt-repo</strong>.</p>
  <img class="cat" src="cat.jpg" alt="Рудий кіт" width="600">
</body>
</html>
